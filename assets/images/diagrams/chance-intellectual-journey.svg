<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="title desc"><title id="title">From fair wagers to probability theory</title><desc id="desc">A conceptual timeline from Renaissance games through Cardano, Pascal and Fermat, Huygens, Bernoulli and Kolmogorov</desc><rect width="1200" height="250" fill="#f5f3ee"/><line x1="110" y1="126" x2="1100" y2="126" stroke="#9ba89b" stroke-width="2"/><g font-family="Georgia,serif" fill="#23352d" text-anchor="middle" font-size="20"><g><circle cx="110" cy="126" r="10" fill="#b2694f"/><text x="110" y="80">Renaissance</text><text x="110" y="103" font-size="15">Fair wagers</text></g><g><circle cx="310" cy="126" r="10" fill="#b2694f"/><text x="310" y="166">Cardano</text><text x="310" y="188" font-size="15">16th c. / 1663</text></g><g><circle cx="510" cy="126" r="10" fill="#b2694f"/><text x="510" y="80">Pascal &amp; Fermat</text><text x="510" y="103" font-size="15">1654</text></g><g><circle cx="710" cy="126" r="10" fill="#b2694f"/><text x="710" y="166">Huygens</text><text x="710" y="188" font-size="15">1657</text></g><g><circle cx="910" cy="126" r="10" fill="#b2694f"/><text x="910" y="80">Bernoulli</text><text x="910" y="103" font-size="15">1713</text></g><g><circle cx="1100" cy="126" r="10" fill="#b2694f"/><text x="1100" y="166">Kolmogorov</text><text x="1100" y="188" font-size="15">1933</text></g></g><text x="600" y="227" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#66756a">Conceptual landmarks, not a claim of a single direct line of influence</text></svg>

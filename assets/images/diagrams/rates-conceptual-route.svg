<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="240" viewBox="0 0 1120 240" role="img" aria-labelledby="t d"><title id="t">Intellectual route from counts to population comparisons</title><desc id="d">A conceptual sequence: Define the population; count events; divide by exposure; inspect age composition; standardize for fair comparisons.</desc><rect width="1120" height="240" rx="22" fill="#f6f4ef"/><g font-family="Arial, sans-serif" fill="#28372e" font-size="22" text-anchor="middle"><rect x="30" y="56" width="184" height="126" rx="12" fill="#e4e8df"/><text x="122" y="110">Define the</text><text x="122" y="138">population</text><rect x="250" y="56" width="184" height="126" rx="12" fill="#e4e8df"/><text x="342" y="110">Count</text><text x="342" y="138">events</text><rect x="470" y="56" width="184" height="126" rx="12" fill="#e4e8df"/><text x="562" y="110">Choose the</text><text x="562" y="138">denominator</text><rect x="690" y="56" width="184" height="126" rx="12" fill="#e4e8df"/><text x="782" y="110">Examine</text><text x="782" y="138">composition</text><rect x="910" y="56" width="184" height="126" rx="12" fill="#d9b89b"/><text x="1002" y="110">Standardize</text><text x="1002" y="138">comparison</text></g><g stroke="#ad674b" stroke-width="3" stroke-linecap="round"><path d="M220 120h22m-7-7 7 7-7 7M440 120h22m-7-7 7 7-7 7M660 120h22m-7-7 7 7-7 7M880 120h22m-7-7 7 7-7 7" fill="none"/></g></svg>

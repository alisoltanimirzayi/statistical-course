<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" role="img" aria-labelledby="t d"><title id="t">From counted possibilities to valued futures</title><desc id="d">Conceptual teaching diagram showing 1494 points problem, 1654 Pascal and Fermat, 1657 Huygens, and later probability and decisions.</desc><rect width="1000" height="230" fill="#f6f4ef"/><path d="M100 115H900" stroke="#bcb9b0" stroke-width="3"/><g fill="#506e60"><circle cx="110" cy="115" r="9"/><circle cx="355" cy="115" r="9"/><circle cx="595" cy="115" r="9"/><circle cx="882" cy="115" r="9"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#293e35"><text x="110" y="80" font-size="23">1494</text><text x="355" y="80" font-size="23">1654</text><text x="595" y="80" font-size="23">1657</text><text x="882" y="80" font-size="23">Later</text><text x="110" y="155" font-size="16">Pacioli</text><text x="355" y="155" font-size="16">Pascal &amp; Fermat</text><text x="595" y="155" font-size="16">Huygens</text><text x="882" y="155" font-size="16">Expectation</text><text x="110" y="178" font-size="12">Earlier points problem</text><text x="355" y="178" font-size="12">Enumeration + recursion</text><text x="595" y="178" font-size="12">Printed probability treatise</text><text x="882" y="178" font-size="12">Insurance + decision theory</text></g></svg>
